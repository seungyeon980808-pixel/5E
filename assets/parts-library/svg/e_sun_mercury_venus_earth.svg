  <g transform="translate(0,45)" style="stroke:none; fill:#000000; font-family:sans-serif; font-size:12px; text-anchor:middle;">
    <text id="txearth"   x="779.5" y="0">Erde</text>
    <text id="txvenus"   x="572.5" y="0">Venus</text>
    <text id="txmercury" x="321.5" y="0">Merkur</text>
    <text id="txsun"     x="31.5"  y="0">Sonne</text>
  </g>

  <g transform="translate(0,45)" style="stroke:none; fill:#000000; font-family:sans-serif; font-size:12px; text-anchor:middle;">
    <text id="txearth"   x="779.5" y="0">earth</text>
    <text id="txvenus"   x="572.5" y="0">venus</text>
    <text id="txmercury" x="321.5" y="0">mercury</text>
    <text id="txsun"     x="31.5"  y="0">sun</text>
  </g>

-->

  <g transform="translate(-8,23)" style="stroke:none; fill:#000000;">
    <use x="31.5"  y="0"  xlink:href="#sun" />
    <use x="321.5" y="0"  xlink:href="#mercury" />
    <use x="572.5" y="-4" xlink:href="#venus" />
    <use x="779.5" y="4"  xlink:href="#earth"/>
  </g>
</svg>
