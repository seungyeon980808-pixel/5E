<?xml version="1.0" standalone="no" ?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20010904//EN"
  "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg width="800px" height="70px" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 70">
  <defs>
    <symbol id="sun">
     <g transform="scale(1.5,1.5)" style="fill:#000000; stroke:none;">
      <path d="M 12,12 A 6,6 0 0 1 6,18 A 6,6 0 0 1 0,12 A 6,6 0 0 1 6,6  A  6,6 0 0 1 12,12
               L 10,12 A 4,4 0 0 0 6,8  A 4,4 0 0 0 2,12 A 4,4 0 0 0 6,16 A  4,4 0 0 0 10,12 z" />
      <circle cx="6" cy="12" r="2" />
     </g>
    </symbol>
    <symbol id="mercury">
     <g transform="scale(1.5,1.5)" style="fill:#000000; stroke:none;">
      <path d="M 12,2  A 6,6 0 0 1 6,8  A 6,6 0 0 1 0,2 L 2,2 A 4,4 0 0 0 6,6 A  4,4 0 0 0 10,2 z" />
      <path d="M 12,12 A 6,6 0 0 1 6,18 A 6,6 0 0 1 0,12 A 6,6 0 0 1 6,6  A  6,6 0 0 1 12,12
               L 10,12 A 4,4 0 0 0 6,8  A 4,4 0 0 0 2,12 A 4,4 0 0 0 6,16 A  4,4 0 0 0 10,12 z" />
      <path d="M 7,17 L 7,24 L 5,24 L 5,17 z" />
      <path d="M 3,20 L 9,20 L 9,22 L 3,22 z" />
     </g>
    </symbol>
    <symbol id="venus">
     <g transform="scale(1.5,1.5)" style="fill:#000000; stroke:none;">
      <path d="M 12,12 A 6,6 0 0 1 6,18 A 6,6 0 0 1 0,12 A 6,6 0 0 1 6,6  A  6,6 0 0 1 12,12
               L 10,12 A 4,4 0 0 0 6,8  A 4,4 0 0 0 2,12 A 4,4 0 0 0 6,16 A  4,4 0 0 0 10,12 z" />
      <path d="M 7,17 L 7,24 L 5,24 L 5,17 z" />
      <path d="M 3,20 L 9,20 L 9,22 L 3,22 z" />
     </g>
    </symbol>
    <symbol id="earth">
     <g transform="scale(1.5,1.5)" style="fill:#000000; stroke:none;">
      <path d="M 12,12 A 6,6 0 0 1 6,18 A 6,6 0 0 1 0,12 A 6,6 0 0 1 6,6  A  6,6 0 0 1 12,12
               L 10,12 A 4,4 0 0 0 6,8  A 4,4 0 0 0 2,12 A 4,4 0 0 0 6,16 A  4,4 0 0 0 10,12 z" />
      <path d="M 7,7 L 7,0 L 5,0 L 5,7 z" />
      <path d="M 3,4 L 9,4 L 9,2 L 3,2 z" />
     </g>
    </symbol>
  </defs>

  <!-- Text or symbols separate for easier translation -->

  <!-- background -->
  <rect cx="0" cy="0" width="800" height="70" style="stroke:#999999; stroke-width:2; fill:#FFFFFF;" />

  <!-- sun -->
  <circle cx="31.5" cy="10" r="3.5" fill="#EEEE00"/>

  <!-- mercury -->
  <circle cx="321.5" cy="10" r="3" fill="#000000"/>
  <polygon transform="translate(0,20)" 
      style="fill:#000000; stroke:none;" 
      points=" 380,-1 380,-4 382,-4 382,1 261,1 261,-4 263,-4 263,-1" />

  <!-- venus -->
  <circle cx="572.5" cy="10" r="3" fill="#000000"/>
  <polygon transform="translate(0,20)" 
      style="fill:#000000; stroke:none;" 
      points=" 575,-1 575,-4 577,-4 577,1 568,1 568,-4 570,-4 570,-1" />

  <!-- earth -->
  <circle cx="779.5" cy="10" r="3" fill="#0000FF"/>
  <polygon transform="translate(0,20)" 
      style="fill:#000000; stroke:none;" 
      points=" 790,-1 790,-4 792,-4 792,1 766,1 766,-4 768,-4 768,-1" />

