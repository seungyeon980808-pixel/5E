<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="-160 -170 320 320">
 <title>Venn diagram of theoretical physics</title>
 <desc>The cGh cube redrawn as a Venn diagram by CMG Lee.</desc>
 <style type="text/css">
svg { font-family:'Liberation Sans',Helvetica,Arial,sans-serif; font-size:15px; text-anchor:middle; fill:#000; stroke:none; }
 </style>
 <defs>
  <filter id="filter_blur"><feGaussianBlur stdDeviation="4"/></filter>
  <radialGradient id="grad_sphere" cx="50%" cy="50%" r="50%" fx="50%" fy="90%">
   <stop offset="0%"  stop-color="#000000" stop-opacity="0"/>
   <stop offset="99%" stop-color="#000000" stop-opacity="0.3"/>
  </radialGradient>
  <linearGradient id="grad_highlight" x1="0%" y1="0%" x2="0%" y2="100%">
   <stop offset="10%" stop-color="#ffffff" stop-opacity="0.9"/>
   <stop offset="99%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <g id="orb" stroke="none">
   <circle  cx="0" cy="0" r="100"/>
   <circle  cx="0" cy="0" r="100" fill="url(#grad_sphere)"/>
   <ellipse cx="0" cy="-45" rx="70" ry="50" fill="url(#grad_highlight)" filter="url(#filter_blur)"/>
  </g>
 </defs>
 <circle cx="0" cy="0" r="99999" fill="#fff"/>
 <use xlink:href="#c" fill="#6cf"/>
 <use xlink:href="#g" fill="#fc0"/>
 <use xlink:href="#h" fill="#f9c"/>
 <clipPath id="clip_g"><circle id="g" r="99" transform="translate(-41, 24)"/></clipPath>
 <clipPath id="clip_h"><circle id="h" r="99" transform="translate( 41, 24)"/></clipPath>
 <clipPath id="clip_c"><circle id="c" r="99" transform="translate(  0,-47)"/></clipPath>
 <use xlink:href="#h" clip-path="url(#clip_c)" fill="#ccf"/>
 <use xlink:href="#c" clip-path="url(#clip_g)" fill="#0c9"/>
 <use xlink:href="#g" clip-path="url(#clip_h)" fill="#f96"/>
 <g clip-path="url(#clip_c)"><use xlink:href="#g" clip-path="url(#clip_h)" fill="#000"/></g>
 <g opacity="0.75" fill="none">
  <use xlink:href="#orb" transform="translate(-41, 24)"/>
  <use xlink:href="#orb" transform="translate( 41, 24)"/>
  <use xlink:href="#orb" transform="translate(  0,-47)"/>
 </g>
 <text transform="translate(  0, 140)"  y="0.6ex">classical mechanics</text>
 <text transform="translate(  0,-110)" y="-0.4ex">special<tspan x="0" dy="2.2ex">relativity</tspan></text>
 <text transform="translate(-65, -49)" y="-0.3ex">general<tspan x="-3" dy="2ex">relativity</tspan></text>
 <text transform="translate( 62, -40)" y="-1.1ex">quantum<tspan x="10" dy="2ex">field</tspan><tspan x="10" dy="1.8ex">theory</tspan></text>
 <text transform="translate(-98,  40)"  y="0.6ex">gravitation</text>
 <text transform="translate( 94,  44)" y="-0.3ex">quantum<tspan x="0" dy="2ex">mechanics</tspan></text>
 <text transform="translate(  0,  73)" y="-1.1ex">non&#183;relativistic<tspan x="0" dy="1.8ex">quantum</tspan><tspan x="0" dy="1.8ex">gravity</tspan></text>
 <text fill="#fff"                     y="-0.4ex">theory of<tspan x="0" dy="2.2ex">everything</tspan></text>
 <g font-style="italic" font-size="24">
  <text transform="translate(-140, 100)" y="0.6ex">G</text>
  <text transform="translate( 140, 100)" y="0.6ex">h</text>
  <text transform="translate(   0,-160)" y="0.6ex">c</text>
 </g>
</svg>
