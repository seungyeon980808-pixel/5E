	<text x="566" y="545">2010</text>
	<text x="605" y="545">2011</text>
	<text x="644" y="545">2012</text>
	<text x="683" y="545">2013</text>
	</g>
		
	<g id="data_legend" transform="translate(0 60)" text-anchor="middle">
	<text x="18" y="505">6.1</text>
	<text x="57" y="503">7.6</text>
	<text x="96" y="500">10.2</text>
	<text x="136" y="495">13.6</text>
	<text x="175" y="490">17.4</text>
	<text x="214" y="481">23.9</text>
	<text x="253" y="470">31.1</text>
	<text x="292" y="462">39.4</text>
	<text x="331" y="447">47.6</text>
	<text x="371" y="431">59.1</text>
	<text x="410" y="411">73.9</text>
	<text x="449" y="376">93.9</text>
	<text x="486" y="345">120.6</text>
	<text x="525" y="291">159.0</text>
	<text x="564" y="236">198.0</text>
	<text x="603" y="183">238.1</text>
	<text x="642" y="118">283.0</text>
	<text x="680" y="69">318.1</text>
	</g>
</g>
</svg>
