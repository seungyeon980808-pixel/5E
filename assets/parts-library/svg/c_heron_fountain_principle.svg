 </defs>
 <circle cx="0" cy="0" r="99999" fill="#ffffff"/>
 <g font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" stroke-linecap="round">
  <g fill="none" stroke="#000000">
   <path d="M0,0 v50 q0,20 20,20 h20 q10,0 10,-10 v-20 h-30 v10 c0,10 -10,10 -10,0 v-40 q0,-10 -10,-15 q-15,-5 -20,25 h-20 q10,10 10,20 v50 q0,20 20,20 h60 q20,0 20,-20 h-70 c0,15 -20,15 -20,0 v-50 q0,-10 10,-20 h-10 q10,-35 20,-20" fill="#66ccff" stroke="none"/>
   <path d="M0,0 v50 q0,20 20,20 h20 q10,0 10,-10 v-20 c0,-10 10,-10 10,0 v30 q0,10 -10,10 h-40 q-10,0 -10,10 c0,15 -20,15 -20,0 v-50 q0,-10 15,-25 m-40,0 q15,15 15,25 v50 q0,20 20,20 h60 q20,0 20,-20 v-50 q0,-20 -20,-20 h-20 q-10,0 -10,10 v20 c0,10 -10,10 -10,0 v-40 q0,-10 -10,-15"/>
   <path d="M18,40 h-63 v-20 h3 M52,40 h25 v50 h-5" opacity="0.5" stroke-dasharray="1,2"/>
   <use xlink:href="#arrow" transform="translate(-25,70) scale(1,-1)"/>
