<line x1="466" y1="714" x2="461" y2="719" stroke="#700" stroke-width="2" transform="rotate(-86.5,145,714)"/>
<line x1="466" y1="714" x2="461" y2="709" stroke="#700" stroke-width="2" transform="rotate(-86.5,145,714)"/>
