<defs>
  <path id="scale" d="M150,515 L150,515 176,83"/>
</defs>
<text font-size="18" font-family="verdana" fill="#aaa">
	<!--textPath xlink:href="#scale">scale change &#x00d7; 100</textPath--><!--mul-->
