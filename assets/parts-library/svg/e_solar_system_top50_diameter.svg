    <!-- y2 = radius/10 -->
    <line x1="10"  x2="10"  y1="0" y2="69570" stroke="#c72"/><!--sun-->
    <line x1="20"  x2="20"  y1="0" y2="6989"  stroke="#050"/><!--jupiter-->
    <line x1="30"  x2="30"  y1="0" y2="5823"  stroke="#050"/><!--saturn-->
