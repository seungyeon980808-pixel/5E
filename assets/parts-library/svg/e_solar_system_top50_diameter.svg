    <line x1="50"  x2="50"  y1="0" y2="2462"  stroke="#050"/><!--neptune-->
    <line x1="60"  x2="60"  y1="0" y2="637"   stroke="#700"/><!--earth-->
  </g>
  <!-- names -->
