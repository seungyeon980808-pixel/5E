<!-- to make it bigger, increase the scale below (e.g., scale(1.2,1.2)) and increase the width and height above to match -->
<g transform="scale(1,1)">
<rect width="930" height="830" x="0" y="0" fill="white" stroke="white"/>

<g transform="translate(10,0)">

<!-- giants chart -->
<g transform="translate(50,720) scale(1.5,-0.01)">
