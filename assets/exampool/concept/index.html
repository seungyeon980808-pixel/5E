<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5E · 문항 작업실</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./concept.css">
  <link rel="stylesheet" href="./workspace.css">
  <link rel="stylesheet" href="./office.css">
  <link rel="stylesheet" href="./white.css">
  <link rel="stylesheet" href="./skins.css">
  <script src="../sheet/vendor/xlsx.full.min.js" defer></script>
  <script src="../sheet/vendor/jszip.min.js" defer></script>
  <script type="module" src="./concept.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/" aria-label="5E 그림 편집기로 돌아가기">5E<span>문항 작업실</span></a>
    <div class="header-history"><button class="icon-button" data-action="undo" title="되돌리기 · ⌘/Ctrl+Z" aria-label="되돌리기">↶</button><button class="icon-button" data-action="redo" title="다시 실행 · ⌘/Ctrl+Shift+Z" aria-label="다시 실행">↷</button></div>
    <div id="header-context"></div>
    <div class="header-actions">
      <select id="theme-select" aria-label="화면 테마" title="화이트·다크 시안 비교"><option value="light">화이트</option><option value="dark">다크</option></select>
      <select id="skin-select" aria-label="화이트 디자인 시안" title="같은 문항으로 화이트 시안 비교"><option value="a">A 펄 민트</option><option value="b">B 그래파이트</option><option value="c">C 리넨</option></select>
      <button id="new-question" class="button primary">+ 새 문항</button>
      <details class="file-menu"><summary>파일 <span aria-hidden="true">⌄</span></summary><div class="command-menu"><button data-action="import">엑셀 가져오기 <span>XLSX</span></button><button id="excel-export">엑셀 내려받기 <span>XLSX</span></button><hr><button data-action="shortcuts">기능·단축키 <span>F1</span></button><a href="../sheet/index.html?example=1" target="_blank" rel="noopener" title="기존 예제로 실제 한글 엔진을 엽니다. 시안의 문항은 전달되지 않습니다.">기존 한글 도구 <span>별도 예제 ↗</span></a></div></details>
    </div>
  </header>
  <div id="sheet-formula" hidden><span id="cell-address">—</span><span id="cell-field">항목</span><span class="formula-symbol">fx</span><textarea id="formula-value" aria-label="선택한 셀 내용" rows="1" disabled></textarea></div>
  <input type="file" id="excel-file" accept=".xlsx" hidden>
  <main id="workspace"></main>
  <footer class="app-footer"><span>5E <span class="footer-divider">/</span> 문항 작업실 시안</span><span id="save-state" role="status">이 브라우저에 저장됩니다</span><span class="change-badge" data-change-summary title="2026-10-15 17:40 KST · 화이트 디자인 시안 A·B·C 추가(상단 선택, ?skin=a|b|c). A 펄 민트: 민트 글로우·떠 있는 창·짙은 녹색 버튼. B 그래파이트: 은회색·선명한 선·차콜 버튼·엑셀 녹색 선택선. C 리넨: 아이보리·살구빛 글로우·에스프레소 버튼. 행·열 머리글 선택 표시와 fx 줄, 한글 도구막대·눈금자·흰 종이 강조. 색·선·그림자만 변경: 기능·데이터·86mm 조판·한 줄 푸터 유지. 실제 HWPX 연결 전인 HTML 편집 시안입니다.">10.15 17:40 · 화이트 시안 A·B·C</span></footer>
  <dialog id="validation-dialog" aria-labelledby="validation-title"><div class="dialog-heading"><h2 id="validation-title">문항 점검</h2><button class="icon-button" id="close-validation" aria-label="점검 닫기">닫기</button></div><div id="validation-body"></div></dialog>
  <dialog id="template-dialog" aria-labelledby="template-title"><div class="dialog-heading"><h2 id="template-title">어떤 모양으로 시작할까요?</h2><button class="icon-button" id="close-template" aria-label="새 문항 닫기">닫기</button></div><p class="muted">자료 모양을 먼저 고르고, 내용을 채우세요.</p><div class="template-grid" id="template-grid"></div></dialog>
  <dialog id="shortcuts-dialog" aria-labelledby="shortcuts-title"><div class="dialog-heading"><h2 id="shortcuts-title">편집 기능·단축키</h2><button class="icon-button" data-action="close-help">닫기</button></div><div id="shortcuts-body"></div></dialog>
  <input id="figure-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <dialog id="materials-dialog" aria-labelledby="materials-title">
    <div class="dialog-heading"><div><h2 id="materials-title">사진·표 관리</h2><p id="material-question" class="muted"></p></div><button class="button small" data-action="close-materials">완료</button></div>
    <div class="materials-toolbar" aria-label="자료 추가"><button data-action="material-add" data-value="figure">+ 사진</button><button data-action="material-add" data-value="table">+ 표</button><button data-action="material-add" data-value="row">+ 가로 묶음</button><button data-action="material-add" data-value="box">+ 자료 상자</button><span></span><button data-action="undo">되돌리기</button><button data-action="redo">다시 실행</button></div>
    <div class="materials-body"><nav id="material-tree" aria-label="자료 객체와 배치 순서"></nav><section id="material-inspector" aria-label="선택한 자료 편집"></section></div>
    <p class="materials-note">변경 내용은 시트와 문항에 바로 반영됩니다. 가로 묶음은 왼쪽부터, 세로 묶음은 위쪽부터 배치됩니다.</p>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
