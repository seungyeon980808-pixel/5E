<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../../">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/unified-library.css">
</head>
<body>
  <button id="open">라이브러리 열기</button>
  <div id="ai-image-panel" hidden></div>
  <script type="module">
    import { createUnifiedLibraryUi } from "./js/unified-library-ui.js";
    const image = (label, color) => `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="600" height="600" fill="white"/><text x="40" y="70" font-size="34">${label}</text><rect x="120" y="150" width="180" height="160" fill="${color}"/><rect x="340" y="330" width="160" height="130" fill="#ddd"/></svg>`)}`;
    const pdfImage = (label, color) => `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><rect width="600" height="800" fill="white"/><text x="40" y="70" font-size="34">${label}</text><rect x="120" y="180" width="180" height="190" fill="${color}"/><rect x="340" y="470" width="160" height="180" fill="#ddd"/></svg>`)}`;
    const rasterizedCrop = async (result, representation) => {
      const rect = representation === "manual" ? result.variants?.manual?.source?.rect : null;
      const source = ["page", "pdf"].includes(result.kind)
        ? pdfImage(`${result.title} / ${representation}`, result.qaColor)
        : image(`${result.title} / ${representation}`, result.qaColor);
      if (!rect) return source;
      const sourceImage = new Image();
      sourceImage.src = source;
      await sourceImage.decode();
      const [x, y, width, height] = rect;
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(sourceImage.naturalWidth * width));
      canvas.height = Math.max(1, Math.round(sourceImage.naturalHeight * height));
      canvas.getContext("2d", { alpha: false }).drawImage(
        sourceImage,
        sourceImage.naturalWidth * x, sourceImage.naturalHeight * y,
        sourceImage.naturalWidth * width, sourceImage.naturalHeight * height,
        0, 0, canvas.width, canvas.height,
      );
      return canvas.toDataURL("image/png");
    };
    const makeQuestion = (id, title, color, provider = "pdf") => ({
      id, title, kind: "crop", cropType: "question", sourceId: "pack", sourceLabel: "QA 자료팩",
      metadata: { academicYear: 2026, subject: "p1", administration: "06", questionNumber: Number(id.slice(1)) },
      provenance: { provider, documentId: "qa.pdf", pageNumber: 1, rect: [0, 0, 1, 1], sha256: "qa-hash-a", sourceKind: "pack", locator: "old.pdf" },
      variants: {
        full: { label: "전체", source: { documentId: "qa.pdf", pageNumber: 1, rect: [0, 0, 1, 1] } },
        figures: [
          { id: `${id}-a`, label: "실험 장치", source: { documentId: "qa.pdf", pageNumber: 1, rect: [0.2, 0.25, 0.3, 0.28] } },
          { id: `${id}-b`, label: "그래프", source: { documentId: "qa.pdf", pageNumber: 1, rect: [0.57, 0.55, 0.27, 0.23] } },
        ],
      },
      preview: { source: { rect: [0, 0, 1, 1] } },
      qaColor: color,
    });
    const all = Array.from({ length: 28 }, (_, index) => makeQuestion(
      `q${index + 1}`,
      `2026학년도 6월 ${index + 1}번`,
      index % 2 ? "#99c2ff" : "#ffc28f",
      index === 1 ? "parts" : "pdf",
    ));
    const matches = [
      { pageNumber: 2, snippet: "A B 같은 쪽", terms: [{ termId: "a", label: "A", color: "#ff4773" }, { termId: "b", label: "B", color: "#3478f6" }], highlights: [{ rect: [0.2, 0.2, 0.2, 0.1], color: "#ff4773" }, { rect: [0.55, 0.55, 0.2, 0.1], color: "#3478f6" }], misses: [] },
      { pageNumber: 4, snippet: "A B 다음 일치", terms: [{ termId: "a", label: "A", color: "#ff4773" }, { termId: "b", label: "B", color: "#3478f6" }], highlights: [], misses: ["a", "b"] },
    ];
    const pdfFile = {
      id: "file:qa", kind: "pdf", documentId: "qa.pdf", sourceId: "pack", title: "아주 긴 한국어 제목의 자석 물리 자료.pdf", subtitle: "QA 자료팩", pageCount: 327,
      provenance: { provider: "pdf", documentId: "qa.pdf", pageNumber: 2 },
      indexState: "indexed", diagnostic: null, revision: "qa-r1", requestId: "fixture", firstMatchingPage: 2, matches,
      loadPreview: async (pageNumber, options = {}) => {
        window.qaPreviewCalls.push({ pageNumber, options: { ...options } });
        window.qaPreviewStarted = performance.now();
        await new Promise((resolve) => setTimeout(resolve, window.qaPreviewDelay ?? 30));
        if (window.qaFailPageOnce === pageNumber) {
          window.qaFailPageOnce = null;
          throw new Error(`QA ${pageNumber}쪽 실패`);
        }
        window.qaPreviewFinished = performance.now();
        return {
          dataUrl: pdfImage(`PDF ${pageNumber}쪽`, "#b8dbb4"),
          source: { documentId: "qa.pdf", pageNumber, rect: [0, 0, 1, 1] },
          result: { id: `page:qa:${pageNumber}`, kind: "page", title: `PDF ${pageNumber}쪽`, sourceId: "pack", sourceLabel: "QA 자료팩", qaColor: "#b8dbb4", provenance: { provider: "pdf", documentId: "qa.pdf", pageNumber } },
        };
      },
    };
    window.qaPreviewCalls = [];
    window.qaRequests = [];
    window.qaOriginalGate = null;
    window.qaOriginalStarted = false;
    window.qaOriginalFinished = false;
    window.qaReplaceFirstSource = () => {
      const original = all[0];
      all[0] = { ...original, provenance: { ...original.provenance, sha256: "qa-hash-b", locator: "replacement.pdf" } };
    };
    const provider = {
      getSources: () => [{ id: "pack", kind: "source", label: "QA 자료팩", counts: { pdf: 1, question: 2 } }],
      getExamFilterOptions: () => ({ academicYears: [2026] }),
      revision: "qa-r1",
      search: ({ query = "", kinds = [] }) => all.filter((item) => kinds.includes(item.kind) && item.title.includes(query)),
      listPdfFiles: () => [{ ...pdfFile, matches: [], firstMatchingPage: 1 }],
      searchPdfFiles: async ({ query = "", requestId, signal }) => {
        window.qaRequests.push({ query, requestId, aborted: signal.aborted, at: performance.now() });
        if (query === "A B") return [pdfFile];
        if (query === "cross page") return [];
        if (query.includes("자석")) return [pdfFile];
        return [];
      },
      materialize: async (result, options = {}) => {
        const representation = options.representation || "full";
        if (options.original && window.qaOriginalGate) {
          window.qaOriginalStarted = true;
          await window.qaOriginalGate.promise;
          window.qaOriginalFinished = true;
        }
        if (window.qaQuestionDelay && result.kind === "crop") {
          await new Promise((resolve) => setTimeout(resolve, window.qaQuestionDelay));
        }
        window.qaMaterialized = representation;
        const manualSource = representation === "manual" ? result.variants?.manual?.source : null;
        return {
          dataUrl: await rasterizedCrop(result, representation),
          provenance: { ...result.provenance, ...(manualSource || {}) },
        };
      },
    };
    window.qaInserted = [];
    window.qaObjectified = [];
    window.qaAiCalls = [];
    window.qaIndependentCalls = [];
    const desktopLibrary = {
      connections: async () => ({ connections: [{ connectionId: "local", displayName: "내 자료", kind: "folder" }] }),
      folderTree: async () => ({ tree: {
        connectionId: "local", folderId: "root", name: "내 자료", files: [],
        children: [{ connectionId: "local", folderId: "empty", name: "빈 폴더", files: [], children: [] }],
      } }),
      setFolderSelection: async () => {},
    };
    const pdfUi = {
      activate: async () => {},
      deactivate: () => {},
      syncDesktopConnections: async () => ({
        connections: (await desktopLibrary.connections()).connections,
        documents: [{ documentId: "waiting.pdf", indexState: { state: "indexing" } }],
      }),
    };
    const ui = createUnifiedLibraryUi({
      getProvider: async () => provider,
      desktopLibrary,
      pdfUi,
      insertMaterialized: async (result, asset) => window.qaInserted.push({ id: result.id, rect: result.provenance.rect, materialized: window.qaMaterialized }),
      openObjectify: async (result) => window.qaObjectified.push({ id: result.id, rect: result.provenance.rect }),
      openAi: async (payload) => {
        window.qaAiCalls.push(payload);
        document.querySelector("#ai-image-panel").hidden = false;
        await new Promise((resolve) => setTimeout(resolve, 60));
        if (window.qaRejectAi) throw new Error("qa handoff rejected");
      },
      openIndependentReferences: new URLSearchParams(location.search).has("independent") ? async (payload) => {
        window.qaIndependentCalls.push(payload);
        document.querySelector("#ai-image-panel").hidden = false;
      } : undefined,
    });
    document.querySelector("#open").addEventListener("click", (event) => ui.open(event.currentTarget));
    document.querySelector("#open").click();
  </script>
</body>
</html>
