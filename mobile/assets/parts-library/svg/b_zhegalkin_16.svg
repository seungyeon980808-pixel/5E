        <path fill="#f55" d="M1,0h1v1h-1M3,0h1v2h-2v-1h1M5,0h1v1h-1M7,0h1v3h-4v-1h2v-1h1M9,0h1v1h-1M11,0h1v2h-2v-1h1M13,0h1v1h-1M15,0h1v4h-8v-1h4v-1h2v-1h1"/>
