<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>5E 시작 중</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 34px 38px 28px;
      color: #e6edf3;
      background:
        radial-gradient(circle at 82% 16%, rgba(47,129,247,.22), transparent 38%),
        linear-gradient(145deg, #18212b 0%, #10161d 72%);
      border: 1px solid #33404d;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      user-select: none;
    }
    .brand { display: flex; align-items: center; gap: 18px; }
    .mark {
      display: grid;
      place-items: center;
      width: 74px;
      height: 74px;
      border-radius: 17px;
      color: #fff;
      background: #2f81f7;
      box-shadow: 0 12px 32px rgba(47,129,247,.26);
      font: italic 800 36px/1 Georgia, serif;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
    .subtitle { margin: 7px 0 0; color: #9aa7b4; font-size: 13px; }
    .science-line { position: relative; height: 62px; opacity: .72; }
    .science-line::before,
    .science-line::after { content: ""; position: absolute; top: 29px; height: 1px; background: #52606d; }
    .science-line::before { left: 0; width: 42%; }
    .science-line::after { right: 0; width: 42%; }
    .orbit { position: absolute; left: 50%; top: 9px; width: 43px; height: 43px; margin-left: -22px; border: 1px solid #5ca0ff; border-radius: 50%; }
    .orbit::before { content: ""; position: absolute; left: 17px; top: 17px; width: 7px; height: 7px; border-radius: 50%; background: #75b2ff; }
    .orbit::after { content: ""; position: absolute; left: -4px; top: 18px; width: 7px; height: 7px; border-radius: 50%; background: #2f81f7; animation: orbit 1.4s linear infinite; transform-origin: 25px 3px; }
    .loading { display: flex; align-items: center; gap: 12px; color: #aeb8c2; font-size: 12px; }
    .bar { position: relative; flex: 1; height: 3px; overflow: hidden; border-radius: 99px; background: #293440; }
    .bar i { position: absolute; width: 34%; height: 100%; border-radius: inherit; background: #2f81f7; animation: load 1.15s ease-in-out infinite; }
    .version { color: #63707d; font-size: 10px; }
    @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(310%); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="brand">
    <div class="mark">5E</div>
    <div><h1>과학 도식 편집기</h1><p class="subtitle">평가원식 과학 이미지를 위한 제작 환경</p></div>
  </div>
  <div class="science-line"><span class="orbit"></span></div>
  <div class="loading"><span>작업 환경을 준비하고 있습니다</span><div class="bar"><i></i></div><span class="version">5E</span></div>
</body>
</html>
