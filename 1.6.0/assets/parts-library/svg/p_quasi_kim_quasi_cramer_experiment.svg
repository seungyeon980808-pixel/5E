         y="712.28186"
         style="font-size:16px;font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;text-align:start;line-height:125%;writing-mode:lr-tb;text-anchor:start;font-family:Times New Roman"
         id="tspan5526">Wall</tspan></text>
    <text
       x="90.09433"
       y="991.33057"
       style="font-size:22px;font-style:normal;font-weight:normal;fill:black;fill-opacity:1;stroke:none;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1;font-family:Bitstream Vera Sans"
       id="text5528"
       xml:space="preserve"><tspan
         x="90.09433"
         y="991.33057"
         id="tspan5530">With plug or wall in place, no interference</tspan><tspan
         x="90.09433"
         y="1018.8306"
         id="tspan5532">will occur at this detection screen.</tspan></text>
    <text
       x="205.37631"
       y="54.543266"
       style="font-size:22px;font-style:normal;font-weight:normal;fill:black;fill-opacity:1;stroke:none;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1;font-family:Bitstream Vera Sans"
       id="text5534"
       xml:space="preserve"><tspan
         x="205.37631"
         y="54.543266"
         id="tspan5536">What will be seen at</tspan><tspan
         x="205.37631"
         y="82.043266"
         id="tspan5538">this screen if only entangled</tspan><tspan
         x="205.37631"
         y="109.54327"
         id="tspan5540">photons are involved? </tspan><tspan
         x="205.37631"
         y="137.04327"
         id="tspan5542">Supposedly, it should depend</tspan><tspan
         x="205.37631"
         y="164.54327"
         id="tspan5544">on the conditions in the other</tspan><tspan
         x="205.37631"
         y="192.04327"
         id="tspan5546">arm of the experiment.</tspan></text>
    <text
       x="69.75045"
       y="839.23584"
       style="font-size:22px;font-style:normal;font-weight:normal;fill:black;fill-opacity:1;stroke:none;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1;font-family:Bitstream Vera Sans"
       id="text5548"
       xml:space="preserve"><tspan
         x="69.75045"
         y="839.23584"
         id="tspan5550">Loop can be inserted after</tspan><tspan
         x="69.75045"
         y="866.73584"
         id="tspan5552">the rest of the apparatus is</tspan><tspan
         x="69.75045"
         y="894.23584"
         id="tspan5554">thoroughly checked out.</tspan></text>
    <text
       x="379.75244"
       y="384.88913"
       style="font-size:22px;font-style:normal;font-weight:normal;fill:black;fill-opacity:1;stroke:none;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1;font-family:Bitstream Vera Sans"
       id="text5556"
       xml:space="preserve"><tspan
         x="379.75244"
         y="384.88913"
         id="tspan5558">If it is possible for a photon in the</tspan><tspan
         x="379.75244"
         y="412.38913"
         id="tspan5560">lower arm to interfere with itself, it </tspan><tspan
         x="379.75244"
         y="439.88913"
         id="tspan5562">will be possible for the entangled </tspan><tspan
         x="379.75244"
         y="467.38913"
         id="tspan5564">photon in the upper arm to interfere</tspan><tspan
         x="379.75244"
         y="494.88913"
         id="tspan5566">with itself. But if it is impossible for</tspan><tspan
         x="379.75244"
         y="522.38916"
         id="tspan5568">the photon in the lower arm to </tspan><tspan
         x="379.75244"
         y="549.88916"
         id="tspan5570">interfere with itself, then it will be</tspan><tspan
         x="379.75244"
         y="577.38916"
         id="tspan5572">impossible for the photon in the </tspan><tspan
         x="379.75244"
         y="604.88916"
         id="tspan5574">upper arm arm to interfere with </tspan><tspan
         x="379.75244"
         y="632.38916"
         id="tspan5576">itself.  </tspan></text>
  </g>
</svg>
