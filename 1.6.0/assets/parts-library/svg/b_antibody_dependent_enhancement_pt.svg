  <title
     id="title1">Antibody dependent enhancement</title>
  <desc
     id="desc1">In antibody-dependent enhancement (ADE), antibodies bind to both viral particles and Fc gamma receptors expressed on immune cells, increasing the likelihood that the viruses will infect those cells, redrawn from http://commons.wikimedia.org/wiki/File:Antibody-dependent_enhancement_(ADE).png by CMG Lee.</desc>
