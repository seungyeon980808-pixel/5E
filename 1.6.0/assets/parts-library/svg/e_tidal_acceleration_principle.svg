<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="-400 -490 1600 900">
 <title>tidal acceleration principle</title>
 <desc>Illustration of tidal acceleration by CMG Lee. In (1), a satellite orbits in the same direction as its parent body's rotation. The nearer tidal bulge (red) attracts the satellite more than the farther bulge (blue), imparting a net positive force in the direction of orbit (dotted arrows showing forces resolved into their components) and lifting it into a higher orbit. In (2), when the rotation is reversed, the net force opposes the direction of orbit, lowering it.</desc>
 <defs>
  <path id="arrowhead" d="M -10,-10 L 0,0 L -10,10" fill="none"/>
  <g id="common" fill="none">
   <g stroke="none">
    <path d="M 80,0 A 80,100 0 0 0 -80,0" fill="#ff9999" transform="rotate(330)"/>
    <path d="M 80,0 A 80,100 0 0 0 -80,0" fill="#0099ff" transform="rotate(150)"/>
    <circle  cx="0" cy="0"    r="80" fill="#996600"/>
    <circle  cx="0" cy="-400" r="15" fill="#999999"/>
   </g>
   <g stroke-width="4">
    <path d="M 25,0 A 25,25 0 1 0 15,20"/>
    <use xlink:href="#arrowhead" transform="translate(16,24)"/>
   </g>
   <g stroke-opacity="0.5">
    <g stroke-dasharray="16,4">
     <path d="M -60,-70 L 0,-400 L 60,70"/>
     <rect x="0"   y="-400" width="30" height="240"/>
     <rect x="-50" y="-400" width="50" height="270"/>
    </g>
    <path d="M -50,-420 c 0,-20 40,0 40,-20 c 0,20 40,0 40,20"/>
   </g>
   <g stroke-width="6" transform="translate(0,-400)">
    <g stroke="#cc00ff">
     <path d="M -30,-60 H 0" stroke-dasharray="7,5"/>
     <use xlink:href="#arrowhead" transform="translate(-30,-60) rotate(180)"/>
    </g>
    <g stroke="#ff0000">
     <path d="M 0,0 L -50,270"/>
     <path d="M -50,0 H 0 V 270" stroke-dasharray="7,7"/>
     <use xlink:href="#arrowhead" transform="translate(-50,  0) rotate(180)"/>
     <use xlink:href="#arrowhead" transform="translate(  0,270) rotate( 90)"/>
     <use xlink:href="#arrowhead" transform="translate(-50,270) rotate(100)"/>
    </g>
    <g stroke="#0066ff">
     <path d="M 0,0 L 30,240"/>
     <path d="M 30,0 H 0 V 240" stroke-dasharray="7,7"/>
     <use xlink:href="#arrowhead" transform="translate( 30,  0)"/>
     <use xlink:href="#arrowhead" transform="translate(  0,240) rotate(90)"/>
     <use xlink:href="#arrowhead" transform="translate( 30,240) rotate(85)"/>
    </g>
   </g>
  </g>
 </defs>
 <circle cx="0" cy="0" r="9999" fill="#ffffff"/>
 <g font-family="Helvetica,Arial,sans-serif" font-size="120" text-anchor="middle" fill="#000000" stroke="#000000" stroke-width="2" stroke-linejoin="round">
  <g>
   <text transform="translate(-350,-420)" y="0.7ex">1</text>
   <g fill="none" stroke="#009900">
    <path d="M 0,-400 A 390,400 0 0 0 0,400 A 390,400 0 1 0 40,-440"/>
    <use xlink:href="#arrowhead" transform="translate(-90,-390) rotate(170)"/>
    <use xlink:href="#arrowhead" transform="translate( 40,-440) rotate(185)"/>
   </g>
   <use xlink:href="#common"/>
  </g>
  <g transform="translate(820,0)">
   <text transform="translate(-350,-420)" y="0.7ex">2</text>
   <g transform="scale(-1,1)">
    <g fill="none" stroke="#009900">
     <path d="M 0,-400 A 380,390 0 0 1 0,380 A 360,370 0 1 1 -25,-360"/>
     <use xlink:href="#arrowhead" transform="translate( 90,-390) rotate(10)"/>
     <use xlink:href="#arrowhead" transform="translate(-25,-360) rotate(-5)"/>
    </g>
    <use xlink:href="#common"/>
   </g>
  </g>
 </g>
</svg>
