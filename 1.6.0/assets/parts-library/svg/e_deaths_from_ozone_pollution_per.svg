  <g id="details" transform="translate(15, 616)">
    <g class="markdown-text-wrap">
      <text style="font-size: 12.375px; fill: rgb(118, 118, 118); line-height: 1.2;" x="0.0" y="12.0">
        <tspan x="0" y="12.0">1. Ozone pollution Ozone pollution refers to ‘tropospheric ozone’ – that is, ozone which exists in the lower atmosphere, close to the surface. Ozone is</tspan>
        <tspan x="0" y="26.9">formed by the reaction with sunlight (photochemical reaction) of pollutants such as nitrogen oxides (NOx) from vehicle and industry emissions and</tspan>
        <tspan x="0" y="41.7">volatile organic compounds (VOCs) emitted by vehicles, solvents and industry.</tspan>
        <tspan x="0" y="56.6">Excessive ozone in the air can have a marked effect on human health. It can cause breathing problems, trigger asthma, reduce lung function, and cause</tspan>
        <tspan x="0" y="71.4">lung diseases.</tspan>
      </text>
    </g>
  </g>
