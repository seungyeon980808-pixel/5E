<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'IBM Plex Sans KR','Malgun Gothic',sans-serif">
  <rect width="820" height="430" rx="18" fill="#101827"/>
  <text x="34" y="48" fill="#f8fafc" font-size="24" font-weight="700">매일 쓰는 작은 동작을 짧게</text>
  <text x="34" y="72" fill="#94a3b8" font-size="12">선택·회전·저장·내보내기·도움말의 동선을 한 단계씩 줄였습니다.</text>
  <g transform="translate(36 105)">
    <rect width="176" height="230" rx="15" fill="#182233" stroke="#334155"/>
    <circle cx="33" cy="34" r="17" fill="#2f81f7"/><text x="33" y="40" text-anchor="middle" fill="white" font-size="16" font-weight="700">A</text>
    <text x="59" y="40" fill="#f8fafc" font-size="15" font-weight="700">전체 선택</text><text x="22" y="75" fill="#94a3b8" font-size="11">Ctrl + A</text>
    <rect x="22" y="94" width="132" height="91" rx="7" fill="#f8fafc"/><g fill="none" stroke="#2f81f7" stroke-width="2" stroke-dasharray="5 4"><rect x="35" y="107" width="44" height="28"/><circle cx="118" cy="126" r="18"/><rect x="53" y="147" width="71" height="24"/></g>
    <text x="22" y="210" fill="#cbd5e1" font-size="10">페이지의 모든 객체를</text><text x="22" y="225" fill="#cbd5e1" font-size="10">한 번에 선택합니다.</text>
  </g>
  <g transform="translate(226 105)">
    <rect width="176" height="230" rx="15" fill="#182233" stroke="#334155"/>
    <circle cx="33" cy="34" r="17" fill="#8357e8"/><path d="M25 36a9 9 0 1 0 3-9" fill="none" stroke="white" stroke-width="2"/><path d="M25 22v8h8" fill="none" stroke="white" stroke-width="2"/>
    <text x="59" y="40" fill="#f8fafc" font-size="15" font-weight="700">빠른 회전</text><text x="22" y="75" fill="#94a3b8" font-size="11">Shift + PageUp / Down</text>
    <rect x="59" y="105" width="75" height="47" transform="rotate(-30 96 128)" fill="none" stroke="#f8fafc" stroke-width="4"/><path d="M35 170q25 35 64 21" fill="none" stroke="#58a6ff" stroke-width="4"/><text x="112" y="194" fill="#58a6ff" font-size="20" font-weight="700">30°</text>
    <text x="22" y="225" fill="#cbd5e1" font-size="10">5°와 30° 회전을 구분합니다.</text>
  </g>
  <g transform="translate(416 105)">
    <rect width="176" height="230" rx="15" fill="#182233" stroke="#334155"/>
    <circle cx="33" cy="34" r="17" fill="#20a84b"/><path d="M33 23v19M25 34l8 8 8-8M24 47h18" fill="none" stroke="white" stroke-width="2"/>
    <text x="59" y="40" fill="#f8fafc" font-size="15" font-weight="700">저장 폴더</text><text x="22" y="75" fill="#94a3b8" font-size="11">한 번 연결하고 계속 사용</text>
    <path d="M25 113h49l11 12h66v64H25z" fill="#e3b341"/><path d="M25 125h126v64H25z" fill="#ffd978"/>
    <text x="88" y="161" text-anchor="middle" fill="#704f00" font-size="13" font-weight="700">시험지 이미지</text>
    <text x="22" y="225" fill="#cbd5e1" font-size="10">PNG·SVG·일괄 내보내기</text>
  </g>
  <g transform="translate(606 105)">
    <rect width="176" height="230" rx="15" fill="#182233" stroke="#334155"/>
    <circle cx="33" cy="34" r="17" fill="#d99500"/><text x="33" y="40" text-anchor="middle" fill="white" font-size="17" font-weight="700">?</text>
    <text x="59" y="40" fill="#f8fafc" font-size="15" font-weight="700">도움말</text><text x="22" y="75" fill="#94a3b8" font-size="11">클릭했을 때만 표시</text>
    <rect x="22" y="99" width="132" height="72" rx="9" fill="#0d1117" stroke="#475569"/><text x="35" y="124" fill="#f8fafc" font-size="11" font-weight="700">자르기 도구</text><text x="35" y="145" fill="#94a3b8" font-size="10">선을 그은 뒤 결과를 확정</text><path d="M40 183h84" stroke="#58a6ff" stroke-width="3"/><circle cx="41" cy="183" r="5" fill="#58a6ff"/><circle cx="124" cy="183" r="5" fill="#58a6ff"/>
    <text x="22" y="225" fill="#cbd5e1" font-size="10">호버 팝업 오작동을 줄였습니다.</text>
  </g>
  <text x="36" y="385" fill="#94a3b8" font-size="12">한국어 자동 줄바꿈 · 내보내기 확정 · 정중앙 불러오기 · 화면 비우기 · 실행 취소 회귀도 함께 정리</text>
</svg>
