<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="'IBM Plex Sans KR','Malgun Gothic',sans-serif">
  <rect width="820" height="330" rx="18" fill="#0d1117"/><text x="32" y="42" fill="#f0f6fc" font-size="21" font-weight="700">참고 이미지는 여러 장, 요청은 영역마다</text><text x="32" y="65" fill="#8b949e" font-size="12">드래그한 위치와 번호가 요청 목록에 그대로 연결됩니다.</text>
  <g transform="translate(32 88)"><rect width="230" height="170" rx="10" fill="#161b22" stroke="#30363d"/><text x="14" y="24" fill="#c9d1d9" font-size="12" font-weight="600">기출 물리 · 도르래 장치</text><rect x="14" y="36" width="202" height="116" rx="6" fill="#f8fafc"/><path d="M35 133h155M62 60h115" stroke="#111827" stroke-width="2"/><circle cx="157" cy="76" r="18" fill="none" stroke="#111827" stroke-width="2"/><path d="M139 76h-53v44M175 76v55" fill="none" stroke="#111827" stroke-width="2"/><rect x="68" y="110" width="37" height="28" fill="none" stroke="#111827" stroke-width="2"/><rect x="129" y="64" width="61" height="69" fill="#2f81f7" fill-opacity=".14" stroke="#2f81f7" stroke-width="2"/><circle cx="129" cy="64" r="12" fill="#2f81f7"/><text x="129" y="68" text-anchor="middle" fill="white" font-size="11" font-weight="700">1</text><text x="14" y="166" fill="#8b949e" font-size="10">영역 요청 1개</text></g>
  <g transform="translate(282 88)"><rect width="230" height="170" rx="10" fill="#161b22" stroke="#30363d"/><text x="14" y="24" fill="#c9d1d9" font-size="12" font-weight="600">교과서 · 비커와 입자</text><rect x="14" y="36" width="202" height="116" rx="6" fill="#f8fafc"/><path d="M48 55v75q0 12 12 12h48q12 0 12-12V55" fill="none" stroke="#111827" stroke-width="2"/><path d="M49 103h70v27q0 11-11 11H60q-11 0-11-11z" fill="#d1d5db"/><rect x="137" y="56" width="59" height="77" fill="none" stroke="#111827" stroke-width="2"/><g fill="none" stroke="#111827"><circle cx="150" cy="69" r="3"/><circle cx="181" cy="73" r="3"/><circle cx="160" cy="91" r="3"/><circle cx="185" cy="110" r="3"/></g><rect x="42" y="96" width="84" height="50" fill="#2f81f7" fill-opacity=".14" stroke="#2f81f7" stroke-width="2"/><circle cx="42" cy="96" r="12" fill="#2f81f7"/><text x="42" y="100" text-anchor="middle" fill="white" font-size="11" font-weight="700">2</text><text x="14" y="166" fill="#8b949e" font-size="10">영역 요청 2개</text></g>
  <g transform="translate(536 88)"><rect width="252" height="204" rx="10" fill="#161b22" stroke="#30363d"/><text x="16" y="27" fill="#f0f6fc" font-size="13" font-weight="650">영역 요청</text><g font-size="11"><circle cx="25" cy="57" r="12" fill="#2f81f7"/><text x="25" y="61" text-anchor="middle" fill="white" font-weight="700">1</text><rect x="45" y="43" width="190" height="35" rx="6" fill="#0d1117" stroke="#30363d"/><text x="56" y="64" fill="#c9d1d9">도르래와 줄의 접촉은 유지</text><circle cx="25" cy="103" r="12" fill="#2f81f7"/><text x="25" y="107" text-anchor="middle" fill="white" font-weight="700">2</text><rect x="45" y="89" width="190" height="35" rx="6" fill="#0d1117" stroke="#30363d"/><text x="56" y="110" fill="#c9d1d9">액체 높이를 조금 낮추기</text><circle cx="25" cy="149" r="12" fill="#2f81f7"/><text x="25" y="153" text-anchor="middle" fill="white" font-weight="700">3</text><rect x="45" y="135" width="190" height="35" rx="6" fill="#0d1117" stroke="#30363d"/><text x="56" y="156" fill="#c9d1d9">입자는 원형만 남기기</text></g><text x="16" y="192" fill="#8b949e" font-size="10">접어서 공간을 줄이고 언제든 다시 수정합니다.</text></g>
</svg>
