<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="'IBM Plex Sans KR','Malgun Gothic',sans-serif">
  <defs><marker id="a9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l8 4-8 4z" fill="#58a6ff"/></marker></defs><rect width="820" height="320" rx="18" fill="#0d1117"/><text x="28" y="41" fill="#f0f6fc" font-size="20" font-weight="700">입력에 따라 세 경로 중 하나를 고릅니다</text><text x="28" y="63" fill="#8b949e" font-size="11">빠른 경로의 숫자를 전체 교과서 이미지 변환 속도로 오해하지 않습니다.</text>
  <g transform="translate(28 88)"><rect width="225" height="177" rx="12" fill="#11271d" stroke="#2ea043"/><text x="18" y="30" fill="#3fb950" font-size="13" font-weight="700">LOCAL VECTOR</text><text x="18" y="56" fill="#f0f6fc" font-size="27" font-weight="800">약 1 ms</text><text x="18" y="78" fill="#8b949e" font-size="11">엄격히 등록된 반복 구조 19종</text><path d="M28 145h145M50 104v41M153 104v41" stroke="#e6edf3" stroke-width="2"/><circle cx="102" cy="116" r="18" fill="none" stroke="#e6edf3" stroke-width="2"/><text x="18" y="164" fill="#3fb950" font-size="10">모델 · 이미지 서버 호출 0</text></g>
  <g transform="translate(297 88)"><rect width="225" height="177" rx="12" fill="#142142" stroke="#2f81f7"/><text x="18" y="30" fill="#58a6ff" font-size="13" font-weight="700">FAST SCENE</text><text x="18" y="56" fill="#f0f6fc" font-size="27" font-weight="800">중앙값 7.2 s</text><text x="18" y="78" fill="#8b949e" font-size="11">참고 이미지 없는 단순 과학 도식</text><path d="M30 144V102M30 144h150" stroke="#e6edf3" stroke-width="2"/><path d="M38 137c28-2 24-30 50-31s22 32 48 28 18-19 39-25" fill="none" stroke="#58a6ff" stroke-width="3"/><text x="18" y="164" fill="#58a6ff" font-size="10">장면 JSON → 편집 가능한 5E 객체</text></g>
  <g transform="translate(566 88)"><rect width="225" height="177" rx="12" fill="#2b2011" stroke="#d29922"/><text x="18" y="30" fill="#e3b341" font-size="13" font-weight="700">IMAGE GENERATION</text><text x="18" y="56" fill="#f0f6fc" font-size="27" font-weight="800">수십 초~수분</text><text x="18" y="78" fill="#8b949e" font-size="11">교과서·기출·손그림·복잡한 삽화</text><rect x="28" y="96" width="76" height="54" rx="5" fill="#f8fafc"/><path d="M39 140l17-19 13 9 14-23 12 33" fill="none" stroke="#57606a" stroke-width="2"/><path d="M123 112h70M123 128h48M123 144h61" stroke="#e6edf3" stroke-width="2"/><text x="18" y="164" fill="#e3b341" font-size="10">원격 서버 상태에 따라 지연 변동</text></g>
  <path d="M254 177h38M523 177h38" stroke="#58a6ff" stroke-width="2" marker-end="url(#a9)"/><text x="410" y="296" text-anchor="middle" fill="#8b949e" font-size="11">지원하지 않는 구조는 정확도를 위해 오른쪽 경로로 안전하게 전환합니다.</text>
