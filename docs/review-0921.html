<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5E 공유·화이트 모드 시안</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e7ebf1;background:#0d1117;font-size:14px}*{box-sizing:border-box}body{margin:0;padding:40px;max-width:1500px;margin:auto}h1{font-size:28px;letter-spacing:-1px}h2{font-size:20px;margin-top:44px}p{color:#9fa9b7;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#171d25;border:1px solid #323a45;border-radius:14px;padding:24px}.label{font-size:12px;letter-spacing:.06em;color:#8ebcff;margin-bottom:16px}h3{margin:0 0 8px;font-size:21px}button,select,input{font:inherit;color:inherit;background:#10161d;border:1px solid #394350;border-radius:8px;padding:10px 12px}button{cursor:pointer}button:hover{border-color:#75aafa}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #70adff;outline-offset:3px}.permissions{display:flex;gap:8px;margin:22px 0 16px}.permissions button{flex:1}.permissions button[aria-pressed=true]{color:#8ebcff;background:#20324b;border-color:#659ae4}.primary{display:block;width:100%;color:#98c3ff;border-color:#4b8ce7;font-weight:600}.result{display:none;margin-top:16px}.result input{width:100%;font-size:12px}.actions{display:flex;gap:8px;margin-top:10px}.actions button:first-child{flex:1}.expiry{font-size:12px;margin-top:14px}.status{min-height:22px;color:#88d2a8;font-size:12px}details{border-top:1px solid #323a45;padding-top:14px;margin-top:14px;color:#a7b0bd;font-size:12px}summary{cursor:pointer}details p{margin-bottom:0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0}.badge{border:1px solid #455c7c;border-radius:20px;font-size:11px;padding:4px 9px;color:#9bc4ff}.step{color:#96a2b2;font-size:12px;margin:22px 0 12px}.editor{--panel:#fff;--canvas:#e5e7eb;--line:#d4d9e1;--text:#202630;--muted:#5d6878;--accent:#1769d2;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:10px}.editor.cool{--panel:#f8fafc;--canvas:#dde5ee;--line:#cbd5e1;--text:#1e293b;--muted:#526579;--accent:#2563eb}.editor.warm{--panel:#fcfbf8;--canvas:#e8e5df;--line:#d6d2c9;--text:#292824;--muted:#68665e;--accent:#266dbe}.toolbar{height:43px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 10px;font-size:12px}.logo{font:bold italic 23px Georgia;color:var(--accent)}.divider{height:19px;border-left:1px solid var(--line)}.workspace{display:grid;grid-template-columns:48px 1fr 75px;height:220px}.tools,.inspector{padding:12px 8px;border-right:1px solid var(--line)}.tools{font-size:16px;line-height:2;text-align:center}.inspector{border-left:1px solid var(--line);border-right:0;line-height:2.2;color:var(--muted)}.stage{background:var(--canvas);position:relative;overflow:hidden;padding:32px 15px 18px}.ruler{position:absolute;top:0;left:0;right:0;padding:4px 7px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--muted);font-size:8px;word-spacing:13px;white-space:nowrap}.watermark{position:absolute;top:31px;left:20px;transform:rotate(-20deg);color:var(--muted);opacity:.28;font:bold italic 11px Georgia}.paper{position:relative;background:white;box-shadow:0 1px 4px #0002;width:100%;height:130px;margin-top:13px}.paper svg{width:100%;height:100%}.bottom{height:30px;padding:6px 10px;border-top:1px solid var(--line);color:var(--muted)}.palette{display:flex;gap:7px;margin-top:14px}.palette i{width:24px;height:24px;border:1px solid #ffffff30;border-radius:5px}.caption{font-size:12px}.variant{padding:0;background:transparent;border:0}footer{margin-top:36px;color:#9fa9b7;font-size:12px}@media(max-width:1050px){.grid{grid-template-columns:1fr}body{padding:20px}.workspace{height:280px}.paper{height:190px}.editor{max-width:650px}.card{max-width:650px}}
</style><h1>5E · 공유와 화이트 모드</h1><p>기존 편집기의 구조를 유지하며, 정보의 우선순위와 색상만 정돈한 비교 시안입니다.<br>공유 버튼은 미리보기용으로 동작하며 실제 문서를 업로드하거나 링크를 생성하지 않습니다.</p><h2>공유 · 세 가지 구성</h2><div class="grid" id="shares"></div><h2>화이트 모드 · 세 가지 팔레트</h2><div class="grid" id="themes"></div><footer>기본 적용 추천: 공유 A + 화이트 A. 가장 익숙한 구조와 중립적인 작업영역을 유지합니다.</footer><script>
const names=['A · 간결한 대화상자','B · 권한을 먼저 선택','C · 단계별 안내'];
const intro=['권한과 링크를 한 화면에서 확인합니다.','현재 권한을 문장으로 쉽게 읽을 수 있습니다.','처음 공유하는 사용자를 위한 순서 안내입니다.'];
const options='<div class="permissions"><button aria-pressed="true">보기 전용</button><button aria-pressed="false">편집 가능</button></div>';
for(let i=0;i<3;i++){const card=document.createElement('section');card.className='card';card.innerHTML=`<div class="label">${names[i]} ${i===0?'<span class="badge">추천 · 기본 적용</span>':''}</div><h3>작업 공유</h3><p>${intro[i]}</p>${i===1?'<div class="row"><span>받는 사람은</span><select aria-label="공유 권한"><option>볼 수 있어요</option><option>편집할 수 있어요</option></select></div>':(i===2?'<div class="step">1 / 권한 선택</div>':'')+options}${i===2?'<div class="step">2 / 링크 만들고 전달</div>':''}<button class="primary" data-create>공유 링크 만들기</button><div class="result"><input aria-label="미리보기 링크" readonly value="https://5e.ai.kr/preview/#share=demo"><div class="actions"><button data-copy>링크 복사</button><button data-revoke>공유 중지</button></div></div><p class="expiry">생성 후 1시간 동안 유효</p><div class="status" role="status"></div><details><summary>공유 범위와 보관 안내</summary><p>원본·크롭·생성 버전과 작업 설정이 전달됩니다. 링크를 가진 사람은 문서를 받을 수 있습니다. 로그인 인증 정보는 포함하지 않습니다.</p><p>편집은 받는 사람의 복사본에 적용됩니다. AI 실행은 받는 사람의 계정을 사용합니다. 보기 전용은 앱 안의 편집 제한입니다.</p><p>임시 서버 재시작 시 조기 만료될 수 있습니다. 받은 문서는 브라우저에 저장되며, 브라우저 데이터를 삭제하면 사라집니다.</p></details>`;document.querySelector('#shares').append(card);card.querySelectorAll('.permissions button').forEach(b=>b.onclick=()=>card.querySelectorAll('.permissions button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))));const status=card.querySelector('.status');card.querySelector('[data-create]').onclick=()=>{card.querySelector('.result').style.display='block';status.textContent='미리보기 링크가 준비되었습니다.'};card.querySelector('[data-copy]').onclick=()=>{status.textContent='시안: 실제 링크는 복사하지 않습니다.'};card.querySelector('[data-revoke]').onclick=()=>{card.querySelector('.result').style.display='none';status.textContent='시안: 공유가 중지되었습니다.'};}
const themes=[['A · 뉴트럴 스튜디오','','#ffffff','#e5e7eb','#202630','#1769d2','추천. 중립 회색으로 문서의 흰색과 도구 영역을 명확하게 구분합니다.'],['B · 쿨 블루프린트','cool','#f8fafc','#dde5ee','#1e293b','#2563eb','청회색 작업영역과 또렷한 파랑으로 기술 도구의 인상을 강조합니다.'],['C · 웜 페이퍼','warm','#fcfbf8','#e8e5df','#292824','#266dbe','따뜻한 회색으로 종이 중심의 차분한 편집 환경을 구성합니다.']];
for(const [title,cls,panel,canvas,text,accent,desc] of themes){const section=document.createElement('section');section.className='variant';section.innerHTML=`<div class="label">${title}</div><div class="editor ${cls}"><div class="toolbar"><span>◧</span><span>↶ ↷</span><span class="divider"></span><span class="logo">5E</span><b>Pro</b><span class="divider"></span><span>설정　파일　공유</span></div><div class="workspace"><div class="tools">↖<br>○ □<br>／ T<br>⌁</div><div class="stage"><div class="ruler">0 10 20 30 40 50</div><div class="watermark">sciEnce Educational Exam Easy Editor</div><div class="paper"><svg viewBox="0 0 200 140" aria-label="과학 도판 미리보기"><path d="M35 105V30M35 105H175M35 95L80 50L125 78L163 38" fill="none" stroke="#333" stroke-width="1.5"/><text x="20" y="24" font-size="9">v</text><text x="179" y="110" font-size="9">t</text></svg></div></div><div class="inspector"><b>아트보드</b><br>너비 90<br>높이 60<br><hr><b>레이어</b><br>도형<br>레이어 1</div></div><div class="bottom">페이지 1　＋　　라이브러리　　AI 이미지 변환</div></div><div class="palette">${[panel,canvas,text,accent].map(c=>`<i title="${c}" style="background:${c}"></i>`).join('')}</div><p class="caption">${desc}</p>`;document.querySelector('#themes').append(section);}
</script></html>
