name: OurDocs Route

on:
  workflow_dispatch:
    inputs:
      base_run:
        description: Currently published successful Exam Library Route run
        required: true
        default: '37703015244'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: validated-web-release
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Verify the published base release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ inputs.base_run }}
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          if (!/^[0-9]+$/.test(process.env.BASE_RUN)) throw new Error('Numeric run required');
          const api = suffix => JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.BASE_RUN}${suffix}`], { encoding: 'utf8' }));
          const run = api('');
          if (run.status !== 'completed' || run.conclusion !== 'success' || run.head_branch !== 'main' || run.path !== '.github/workflows/examlibrary-route.yml') throw new Error('A successful published Exam Library Route is required');
          const jobs = api('/jobs?per_page=100').jobs;
          if (!['validate', 'publish'].every(name => jobs.some(job => job.name === name && job.conclusion === 'success'))) throw new Error('Base publication did not pass');
          NODE
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.base_run }}
          name: github-pages
          path: _work/ourdocs-base-pages
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.base_run }}
          pattern: examlibrary-publication-*
          merge-multiple: true
          path: _work/ourdocs-base-receipt
      - run: |
          mkdir -p _work/ourdocs-publication/site
          tar -xf _work/ourdocs-base-pages/artifact.tar -C _work/ourdocs-publication/site
      - name: Confirm the current homepage and exam library still match this artifact
        run: |
          node - <<'NODE'
          const fs = require('node:fs'); const crypto = require('node:crypto');
          const base = JSON.parse(fs.readFileSync('_work/ourdocs-base-receipt/receipt.json', 'utf8'));
          (async () => {
            for (const file of ['index.html', 'js/release-receipt.js', 'examlibrary/index.html']) {
              const response = await fetch(`https://www.5e.ai.kr/${file}?ourdocs-check=${process.env.GITHUB_RUN_ID}`, { signal: AbortSignal.timeout(30000) });
              if (!response.ok || crypto.createHash('sha256').update(Buffer.from(await response.arrayBuffer())).digest('hex') !== base.files[file]) throw new Error(`Published base changed: ${file}`);
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Append only the committed OurDocs entry
        run: node scripts/ourdocs-publication.cjs --site _work/ourdocs-publication/site --base-receipt _work/ourdocs-base-receipt/receipt.json --receipt _work/ourdocs-publication/receipt.json
      - run: node --test tests/test-ourdocs-entry.cjs
      - name: Verify the deployed OurDocs service
        run: |
          node - <<'NODE'
          (async () => {
            const origin = 'https://ourdocs-cloud.5e-desktop.workers.dev';
            const ready = await fetch(origin + '/ourdocs/health/ready');
            if (!ready.ok || (await ready.json()).status !== 'ok') throw new Error('OurDocs is not ready');
            const app = await fetch(origin + '/ourdocs/');
            const csp = app.headers.get('content-security-policy') || '';
            if (!app.ok || !csp.includes('https://www.5e.ai.kr') || !csp.includes('https://5e.ai.kr')) throw new Error('OurDocs cannot be embedded by 5E');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - run: node scripts/ourdocs-publication.cjs --verify --site _work/ourdocs-publication/site --receipt _work/ourdocs-publication/receipt.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _work/ourdocs-publication/site
      - uses: actions/upload-artifact@v4
        with:
          name: ourdocs-publication-${{ github.sha }}
          path: _work/ourdocs-publication/receipt.json

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ourdocs/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
