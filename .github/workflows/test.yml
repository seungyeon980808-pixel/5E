name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    # Native WebKit is the reference for the existing rendering/performance gate.
    # This suite also exercises headed browser interactions.
    runs-on: macos-latest
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/_work/ci/evidence/browser
      TASK2_EVIDENCE: ${{ github.workspace }}/_work/ci/evidence/lifecycle
      TASK8_EVIDENCE: ${{ github.workspace }}/_work/ci/evidence/multiselect
      TASK9_HEADED: '1'
      TASK9_PERFORMANCE_REFERENCE: .github/browser-performance-reference.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/check-browser-performance-reference.cjs
      - run: npm run test:unit
      - run: npm run test:browser
      - name: Preserve regression diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            _work/ci/evidence
            .omo/evidence
          if-no-files-found: ignore
