name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    # Native WebKit is the reference for the existing rendering/performance gate.
    # This suite also exercises headed browser interactions.
    runs-on: macos-latest
    env:
      TASK9_HEADED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:unit
      - run: npm run test:browser
