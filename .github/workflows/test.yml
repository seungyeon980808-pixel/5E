name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    # Native WebKit is the reference for the existing rendering/performance gate.
    # This suite also exercises headed browser interactions.
    runs-on: macos-latest
    env:
      # The integration's canonical product entry is the repository root.
      # Public /preview identity and storage isolation have dedicated checks.
      APP_ENTRY: '/'
      EVIDENCE_DIR: ${{ github.workspace }}/_work/ci/evidence/browser
      TASK2_EVIDENCE: ${{ github.workspace }}/_work/ci/evidence/lifecycle
      TASK8_EVIDENCE: ${{ github.workspace }}/_work/ci/evidence/multiselect
      TASK9_HEADED: '1'
      # 한 검사가 멈춰도 전체가 무한정 걸리지 않게 검사마다 10분 제한.
      BROWSER_SUITE_TIMEOUT_MS: '600000'
      # 느린 GitHub 컴퓨터의 타이밍 흔들림은 한 번 다시 돌려 보고, 그래도 실패할 때만 새 실패로 본다.
      BROWSER_SUITE_RETRIES: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium webkit
      # 실제 Mac 성능 기준값(.github/browser-performance-reference.json)은 코드가 바뀔 때마다
      # 다시 재야 맞기 때문에 이 검사를 막지 않는다. 성능은 수동 Browser Performance Diagnostics로 잰다.
      - run: npm run test:unit
      # 필수 묶음: 프리뷰 배포 검사와 같은 5묶음(두 엔진)과 버튼 디자인. 하나라도 실패하면 막는다.
      - name: Required browser suites
        run: |
          for engine in chromium webkit; do
            TASK2_ENGINE=$engine node --test tests/test-ai-inline-label-editor-browser.cjs tests/test-library-space-flow-browser.cjs tests/test-library-crop-confirm-browser.cjs tests/test-ai-local-edit-browser.cjs tests/test-ai-library-transfer-browser.cjs
          done
          node tests/run-browser-tests.cjs --only test-button-design-browser.cjs
      # 전체 브라우저 검사: tests/known-failures.json에 이유와 함께 적힌 검사의 실패는 막지 않고,
      # 목록에 없는 새 실패만 막는다. 목록에 있던 검사가 통과하면 경고로 알린다.
      - name: All browser suites (new failures only)
        if: always()
        run: npm run test:browser -- --known-failures tests/known-failures.json --report _work/ci/evidence/browser-report.json
      - name: Preserve regression diagnostics
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ci-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            _work/ci/evidence
            .omo/evidence
          if-no-files-found: ignore
