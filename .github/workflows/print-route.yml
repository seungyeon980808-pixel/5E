name: Print Route

# 5e.ai.kr/print: 지금 게시된 사이트를 그대로 두고 print 설문 한 장(print/index.html)만 덧붙인다.
on:
  workflow_dispatch:
    inputs:
      base_run:
        description: Currently published successful route run (1.7.0 Preview, Bug, Hub, Memo or Print)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: validated-web-release
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Verify the current published base and download its receipt
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ inputs.base_run }}
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          if (!/^[0-9]+$/.test(process.env.BASE_RUN)) throw Error('Numeric run required');
          const api = suffix => JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/${suffix}`], { encoding: 'utf8' }));
          const run = api(`actions/runs/${process.env.BASE_RUN}`);
          if (run.status !== 'completed' || run.conclusion !== 'success' || run.head_branch !== 'main'
              || !['.github/workflows/memo-route.yml', '.github/workflows/hub-route.yml', '.github/workflows/bug-route.yml', '.github/workflows/preview-release.yml', '.github/workflows/print-route.yml'].includes(run.path)) throw Error('Successful route publication required');
          const jobs = api(`actions/runs/${process.env.BASE_RUN}/jobs?per_page=100`).jobs;
          if (!['validate', 'publish'].every(name => jobs.some(job => job.name === name && job.conclusion === 'success'))) throw Error('Base publication did not pass');
          let latest;
          for (const deployment of api('deployments?environment=github-pages&per_page=100')) {
            const status = api(`deployments/${deployment.id}/statuses?per_page=1`)[0];
            if (status?.state === 'success') { latest = status; break; }
          }
          if (!latest?.log_url?.includes(`/actions/runs/${process.env.BASE_RUN}/`)) throw Error('Base is not the latest successful Pages publication');
          const artifacts = api(`actions/runs/${process.env.BASE_RUN}/artifacts?per_page=100`).artifacts.filter(a => !a.expired);
          const receipt = artifacts.find(a => /-publication-/.test(a.name));
          if (!receipt) throw Error('Published inventory receipt missing');
          execFileSync('gh', ['run', 'download', process.env.BASE_RUN, '-n', receipt.name, '-D', '_work/print-base-receipt'], { stdio: 'inherit' });
          if (artifacts.some(a => a.name === 'github-pages')) execFileSync('gh', ['run', 'download', process.env.BASE_RUN, '-n', 'github-pages', '-D', '_work/print-base-pages'], { stdio: 'inherit' });
          NODE
      - name: Normalize the base receipt (1.7.0 Preview keeps it in a subfolder)
        run: node -e "require('./scripts/publication-receipt.cjs').normalizePublicationReceipt('_work/print-base-receipt')"
      - name: Recover or unpack the exact published base
        run: |
          if test -f _work/print-base-pages/artifact.tar; then
            mkdir -p _work/print-publication/site
            tar -xf _work/print-base-pages/artifact.tar -C _work/print-publication/site
          else
            # Pages 묶음은 7일 뒤 지워진다: Git 기록에서 되살리고, 기록에 없는 생성 파일만 게시본에서 받아 해시로 확인
            git fetch origin 751b1ed4622058497a6f3ba43f92333eb15268eb
            node - <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const { recoverBase } = require('./scripts/preview-publication.cjs');
          const receipt = JSON.parse(fs.readFileSync('_work/print-base-receipt/receipt.json', 'utf8'));
          // 1.7.0 Preview 게시본은 preview/ 파일이 미리보기 원본 커밋에 있으므로 그 커밋도 찾을 곳에 넣는다(내용은 해시로 확인)
          const lookup = receipt.previewSourceCommit ? { ...receipt, baseRouteCommit: receipt.previewSourceCommit } : receipt;
          recoverBase({ site: '_work/print-publication/site', receipt: lookup, repository: path.resolve('.'), cache: '_work/print-base-blobs' })
            .then(result => console.log(`Recovered ${result.files} files, ${result.generated.length} from the live site`), error => { console.error(error); process.exitCode = 1; });
          NODE
          fi
      - name: Confirm the public routes still match the base
        run: |
          node - <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto');
          const base = JSON.parse(fs.readFileSync('_work/print-base-receipt/receipt.json', 'utf8'));
          (async () => {
            const files = ['index.html', '404.html', 'js/release-receipt.js', 'examlibrary/index.html', 'ourdocs/index.html'];
            for (const file of ['memo/config.js', 'hub/index.html', 'bug/index.html', 'preview/index.html', 'print/index.html']) if (base.files[file]) files.push(file);
            for (const file of files) {
              const response = await fetch(`https://www.5e.ai.kr/${file}?print-check=${process.env.GITHUB_RUN_ID}`, { signal: AbortSignal.timeout(30000) });
              if (!response.ok || crypto.createHash('sha256').update(Buffer.from(await response.arrayBuffer())).digest('hex') !== base.files[file]) throw Error(`Published base changed: ${file}`);
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - run: node --test desktop/print-publication.test.cjs
      - name: Append the committed print survey
        run: node scripts/print-publication.cjs --site _work/print-publication/site --base-receipt _work/print-base-receipt/receipt.json --receipt _work/print-publication/receipt.json
      - run: node scripts/print-publication.cjs --verify --site _work/print-publication/site --receipt _work/print-publication/receipt.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _work/print-publication/site
      - uses: actions/upload-artifact@v4
        with:
          name: print-publication-${{ github.sha }}
          path: _work/print-publication/receipt.json

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}print/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
