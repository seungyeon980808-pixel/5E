name: Release Identity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-identity:
    name: Release Identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
      - run: npm run verify:release-identity -- --sha "${{ github.sha }}"
