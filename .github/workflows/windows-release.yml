name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: macos-latest
    env:
      TASK9_HEADED: '1'
      TASK9_PERFORMANCE_REFERENCE: .github/browser-performance-reference.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/check-browser-performance-reference.cjs
      - run: npm run test:unit
      - run: npm run test:browser

  release-identity:
    name: Release Identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm run verify:release-identity -- --sha "${{ github.sha }}" --tag "${{ github.ref_name }}"

  build-windows:
    needs: [test, release-identity]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit
      - run: npm run verify:release-identity -- --sha "${{ github.sha }}" --tag "${{ github.ref_name }}"
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: 5e-windows
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    needs: [test, release-identity]
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit
      - run: npm run verify:release-identity -- --sha "${{ github.sha }}" --tag "${{ github.ref_name }}"
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: 5e-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Enforce release hold
        run: node scripts/check-release-gate.cjs --tag "${{ github.ref_name }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: 5e-*
          path: release-assets
          merge-multiple: true
      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt
      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          notes_path="docs/RELEASE_NOTES_${tag}.md"
          release_title="5E ${tag}"
          if [[ -f "$notes_path" ]]; then
            parsed_title=$(sed -n 's/^<!-- release-title: \(.*\) -->$/\1/p' "$notes_path" | head -n 1)
            if [[ -n "$parsed_title" ]]; then release_title="$parsed_title"; fi
            gh release create "$tag" release-assets/* --draft --notes-file "$notes_path" --title "$release_title"
          else
            gh release create "$tag" release-assets/* --draft --generate-notes --title "$release_title"
          fi
