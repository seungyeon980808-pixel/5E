name: Windows Stable Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-publish-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted environment validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Require protected stable-release environment
        env:
          STABLE_RELEASE_ENVIRONMENT_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: node scripts/stabilization/stable-release-environment.cjs

  verify-and-build:
    needs: verify-publish-environment
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - name: Reject non-stable or mismatched release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/stabilization/stable-release-cli.cjs preflight
      - name: Install dependencies
        run: npm ci
      - name: Run complete release verification
        run: npm run verify:release
      - name: Build exact Windows package
        run: npm run package:win -- "-c.extraMetadata.buildCommit=${{ github.sha }}"
      - name: Strictly audit packaged application
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/stabilization/package-artifact-audit.cjs --strict --artifact release/win-unpacked --web-version $version --web-commit $env:GITHUB_SHA > release/package-artifact-audit.json
      - name: Validate exact bundle and write checksum plan
        id: bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/stabilization/stable-release-cli.cjs bundle
      - name: Transfer only the verified release bundle
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: stable-release-${{ github.sha }}
          path: |
            ${{ steps.bundle.outputs.installer }}
            ${{ steps.bundle.outputs.checksum }}
            ${{ steps.bundle.outputs.notes }}
            ${{ steps.bundle.outputs.plan }}
            ${{ steps.bundle.outputs.audit }}
          if-no-files-found: error
          retention-days: 1

  publish-draft:
    needs: verify-and-build
    runs-on: windows-latest
    timeout-minutes: 15
    environment: stable-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Freshly fetch exact publish SHA, full history, tags, and main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified release bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: stable-release-${{ github.sha }}
          path: release
      - name: Revalidate exact publish inputs
        id: publish
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/stabilization/stable-release-cli.cjs publish
      - name: Revalidate protected environment immediately before draft creation
        env:
          STABLE_RELEASE_ENVIRONMENT_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: node scripts/stabilization/stable-release-environment.cjs
      - name: Create protected draft stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.publish.outputs.tag }}" "${{ steps.publish.outputs.installer }}" "${{ steps.publish.outputs.checksum }}" --verify-tag --target "${{ steps.publish.outputs.commit }}" --draft --latest --notes-file "${{ steps.publish.outputs.notes }}" --title "5E ${{ steps.publish.outputs.tag }}"
