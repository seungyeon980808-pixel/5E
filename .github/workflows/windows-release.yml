name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Windows installer
        run: npm run package:win

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not created" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            (Get-ChildItem -LiteralPath release -Filter "*.exe" | Select-Object -First 1).FullName
            (Resolve-Path -LiteralPath release/SHA256SUMS.txt).Path
          )
          $notesPath = "docs/RELEASE_NOTES_$tag.md"
          if (Test-Path -LiteralPath $notesPath) {
            $firstLine = Get-Content -LiteralPath $notesPath -Encoding utf8 -TotalCount 1
            $releaseTitle = if ($firstLine -match '^<!-- release-title: (.+) -->$') { $Matches[1] } else { "5E $tag" }
            & gh release create $tag @assets --notes-file $notesPath --title $releaseTitle
          } else {
            & gh release create $tag @assets --generate-notes --title "5E $tag"
          }
